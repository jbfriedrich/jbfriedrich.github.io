# item-level shape hostility — Hugo's XML unmarshal returns a map for a
# single element and a slice for several; each of these must survive a
# green build (final whole-branch review, C1 and C2)
[[params.sources]]
  key = "one_atom"
  label = "One Atom"
  kind = "atom"
  feed = "http://127.0.0.1:8099/one-atom.xml"       # exactly 1 <entry>: map, not slice
  home = "https://example.org/"
  count = 3
  hue = "posts"

[[params.sources]]
  key = "one_rss"
  label = "One RSS"
  kind = "rss"
  feed = "http://127.0.0.1:8099/one-rss.xml"        # exactly 1 <item>: map, not slice
  home = "https://example.org/"
  count = 3
  hue = "posts"

[[params.sources]]
  key = "one_goodreads"
  label = "One Goodreads"
