baseURL = "https://friedrich.uk/"
languageCode = "en-gb"
title = "Jason Friedrich"
disableKinds = ["taxonomy", "term", "section", "page", "RSS", "sitemap", "robotsTXT", "404"]

[module]
  # min: `.Err` was removed in 0.141 and replaced by the `try` keyword, which
  #      this site's feed-fetching partials rely on.
  # max: Hugo 0.161.0 dropped support for the Tailwind STANDALONE binary --
  #      css.TailwindCSS now demands @tailwindcss/cli installed via npm as a
  #      Node script, because Hugo runs Node tools under `node --permission`
  #      to sandbox their filesystem access (commit a54c398, issue #7287).
  #      That hardening only benefits people already in the npm ecosystem; we
  #      deliberately are not. Pinned below 0.161 so we keep the single
  #      self-contained binary and no node_modules. Without this max, a newer
  #      Hugo fails with the opaque `binary "tailwindcss" is not a Node.js
  #      script` at render time. NOTE: for the main project this only WARNS
  #      (exit 0) -- the hard failure lives in layouts/partials/head.html.
  [module.hugoVersion]
    min = "0.141.0"
    max = "0.160.1"
    extended = true

[params]
  author   = "Jason Friedrich"
  email    = "hello@friedrich.uk"
  tagline  = "Websites, projects & social media"
  preset   = "channels"
  mastodon = "https://click.ba.it/@jason"
  fediverseCreator = "@jason@click.ba.it"
  bio = "Lefty, tech nerd, movie trivia hoarder and IT professional — I specialise in shaking my fist at clouds for a living. Everything I publish, in one place."

[caches.getresource]
  dir    = ":cacheDir/:project"
  maxAge = "55m"

