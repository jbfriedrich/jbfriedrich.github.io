baseURL = "https://friedrich.uk/"
languageCode = "en-gb"
title = "Jason Friedrich"
disableKinds = ["taxonomy", "term", "section", "page", "RSS", "sitemap", "robotsTXT", "404"]

[module]
  [module.hugoVersion]
    min = "0.141.0"

[params]
  author   = "Jason Friedrich"
  email    = "hello@friedrich.uk"
  tagline  = "Websites, projects & social media"
  preset   = "channels"
  mastodon = "https://click.ba.it/@jason"
  fediverseCreator = "@jason@click.ba.it"
  bio = "Lefty, tech nerd, movie trivia hoarder and IT professional — I specialise in shaking my fist at clouds for a living. Everything I publish, in one place."

[caches.getresource]
  dir    = ":cacheDir/:project"
  maxAge = "55m"

