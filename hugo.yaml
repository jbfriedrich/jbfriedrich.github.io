baseURL: "https://friedrich.uk/"
languageCode: "en-us"
title: "Jason Friedrich"
disableKinds: ["taxonomy", "term", "section", "page", "RSS", "sitemap", "robotsTXT", "404"]

module:
  hugoVersion:
    # min: `.Err` was removed in 0.141 and replaced by the `try` keyword, which
    #      this site's feed-fetching partials rely on.
    # max: Hugo 0.161.0 dropped support for the Tailwind standalone binary --
    #      css.TailwindCSS now requires @tailwindcss/cli installed via npm as a
    #      Node script, so Hugo can run it under `node --permission` and sandbox
    #      its filesystem access (commit a54c398, issue #7287). Pinned below
    #      0.161 to keep the single self-contained binary and no node_modules.
    #      For the main project this only WARNS (exit 0); the hard failure lives
    #      in layouts/partials/head.html.
    min: "0.141.0"
    max: "0.160.1"
    extended: true

caches:
  getresource:
    dir: ":cacheDir/:project"
    # Comfortably under the rebuild interval, so every scheduled rebuild sees
    # fresh feeds. What the cache actually buys is not re-fetching six third
    # parties when a push triggers a webhook build right after a scheduled one.
    #
    # It has to clear the interval with room to spare, not merely fit inside it.
    # The timer is hourly with RandomizedDelaySec=300, so two scheduled runs can
    # be as little as 55 minutes apart -- and an off-cycle webhook build
    # re-anchors the cache clock to a time that is not on the hour. At 55m that
    # left content a full cycle stale.
    maxAge: "45m"

params:
  author: "Jason Friedrich"
  email: "hello@friedrich.uk"
  tagline: "Websites, projects & social media"
  # Card image for link previews: a 1200x630 banner, the same one the wilde
  # blogs ship. Kept in step by hand -- this site does not use that theme.
  ogImage: "/images/og-feature-image.jpg"
  ogImageAlt: "Long-exposure neon light trails along a city street at night"
  bio: "Lefty, tech nerd, movie trivia hoarder and IT professional. I specialise in shaking my fist at clouds for a living. Everything I write on the Internet – all in one place."
  # Copy for a tile with nothing in it. A source that resolves and simply has
  # nothing to show says so; one that could not be reached says something else,
  # because they are different facts and a visitor can tell them apart. A source
  # can override the first with its own `empty`.
  emptyText: "Nothing here right now"
  unavailableText: "This source is unavailable right now"

  # channels (tiles) or signal (dense rows). Both read the same normalised data.
  preset: "channels"
  mastodon: "https://click.ba.it/@jason"
  fediverseCreator: "@jason@click.ba.it"

  # Every source is declared here: no hostname, feed URL or item count appears in
  # a template, so moving a domain is a config edit.
  #   kind      atom | rss | goodreads -- selects the branch in normalise.html
  #   count     items shown on the page
  #   overfetch items read before filtering, when excludes would otherwise eat
  #             the whole count
  #   excludes  drop items whose URL or summary contains any of these
  #   empty     what the tile says when the source resolves with no items,
  #             overriding params.emptyText
  #   span      tile width in columns of the six-column mosaic. The spans of the
  #             sources in one row must add up to 6, or the row leaves a hole.
  #             A tile of 3 or more goes full-width on tablets; smaller ones pair
  #             up two per row.
  #   full      render the tile body as a cover grid (books)
  sources:
    - key: posts
      label: Posts
      kind: atom
      feed: "https://undertow.blog/posts/index.xml"
      home: "https://undertow.blog/posts/"
      count: 3
      span: 2
      hue: posts

    - key: notes
      label: Notes
      kind: atom
      feed: "https://undertow.blog/notes/index.xml"
      home: "https://undertow.blog/notes/"
      count: 3
      span: 2
      hue: notes

    - key: links
      label: Links
      kind: atom
      feed: "https://undertow.blog/links/index.xml"
      home: "https://undertow.blog/links/"
      count: 3
      span: 2
      hue: links

    - key: asides
      label: Ramblings
      kind: rss
      feed: "https://asides.blog/rss/"
      home: "https://asides.blog/"
      count: 3
      span: 3
      hue: asides

    # Asides are cross-posted here, so the same item would appear twice on the
    # page. Read a wider window, drop the cross-posts, then take count -- doing
    # it the other way round empties the tile on a busy day.
    - key: mastodon
      label: Mastodon
      kind: rss
      feed: "https://click.ba.it/@jason.rss"
      home: "https://click.ba.it/@jason"
      count: 3
      overfetch: 25
      excludes: ["asides.blog"]
      span: 3
      hue: masto

    - key: reading
      label: Currently reading
      kind: goodreads
      feed: "https://www.goodreads.com/review/list_rss/145074430?shelf=currently-reading"
      empty: "Not reading anything at the moment"
      count: 1
      span: 2
      hue: books
      full: true

    - key: books
      label: Last read
      kind: goodreads
      feed: "https://www.goodreads.com/review/list_rss/145074430?shelf=read"
      home: "https://www.goodreads.com/jbfriedrich"
      count: 3
      span: 4
      hue: books
      full: true

  links:
    - label: Mastodon
      url: "https://click.ba.it/@jason"
      me: true
    - label: Instagram
      url: "https://www.instagram.com/jbf.png/"
    - label: GitHub
      url: "https://github.com/jbfriedrich"
    - label: LinkedIn
      url: "https://www.linkedin.com/in/jbfriedrich"
